[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-tracker"
version = "0.1.0"
description = "A typed flight tracker for Raspberry Pi hardware"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "types-requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["flight_tracker*"]
